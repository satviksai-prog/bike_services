<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Filter Glow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="300" cy="250" r="180" fill="url(#glowGrad)" filter="url(#softGlow)" />
  <circle cx="450" cy="180" r="100" fill="#06b6d4" fill-opacity="0.12" filter="url(#softGlow)" />

  <!-- Connecting Abstract Network Lines -->
  <path d="M 120 180 Q 250 140 380 180 T 500 300" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35"/>
  <path d="M 100 340 Q 240 380 400 320 T 520 200" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Background Layer: Secondary Mockup Card -->
  <g transform="translate(180, 70)" filter="url(#cardShadow)">
    <rect width="360" height="260" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="360" height="34" rx="16" fill="#0f172a"/>
    <circle cx="20" cy="17" r="4" fill="#ef4444"/>
    <circle cx="34" cy="17" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="17" r="4" fill="#10b981"/>
    
    <!-- Code Editor Representation -->
    <rect x="25" y="55" width="90" height="10" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="125" y="55" width="60" height="10" rx="3" fill="#64748b" opacity="0.6"/>
    
    <rect x="25" y="80" width="140" height="8" rx="3" fill="#38bdf8" opacity="0.5"/>
    <rect x="175" y="80" width="80" height="8" rx="3" fill="#a855f7" opacity="0.6"/>
    
    <rect x="45" y="105" width="110" height="8" rx="3" fill="#10b981" opacity="0.6"/>
    <rect x="165" y="105" width="130" height="8" rx="3" fill="#64748b" opacity="0.4"/>
    
    <rect x="45" y="130" width="80" height="8" rx="3" fill="#f59e0b" opacity="0.6"/>
    <rect x="135" y="130" width="120" height="8" rx="3" fill="#38bdf8" opacity="0.5"/>
    
    <rect x="25" y="155" width="50" height="8" rx="3" fill="#3b82f6" opacity="0.8"/>

    <rect x="25" y="190" width="310" height="45" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="218" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981">✓ Build Passing</text>
    <text x="230" y="218" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">100% responsive</text>
  </g>

  <!-- Foreground Main Window: Modern Web Application Interface -->
  <g transform="translate(60, 140)" filter="url(#cardShadow)">
    <rect width="400" height="280" rx="16" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 384 0 C 392.837 0 400 7.163 400 16 L 400 40 L 0 40 Z" fill="#1e293b"/>
    <circle cx="22" cy="20" r="5" fill="#ef4444"/>
    <circle cx="38" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="20" r="5" fill="#10b981"/>
    <rect x="90" y="10" width="220" height="20" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="140" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="0.5">https://portfolio.dev</text>

    <!-- Main Card Body -->
    <!-- Sidebar -->
    <rect x="15" y="55" width="75" height="210" rx="8" fill="#1e293b" opacity="0.7"/>
    <rect x="25" y="70" width="55" height="10" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="25" y="90" width="45" height="8" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="25" y="106" width="50" height="8" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="25" y="122" width="40" height="8" rx="3" fill="#64748b" opacity="0.5"/>

    <!-- Dashboard Main View -->
    <rect x="105" y="55" width="280" height="60" rx="8" fill="#1e293b" opacity="0.9"/>
    <text x="120" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Software Solution</text>
    <text x="120" y="98" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Clean Architecture &amp; User Experience</text>
    <rect x="315" y="70" width="55" height="28" rx="6" fill="#3b82f6"/>
    <text x="328" y="88" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Deploy</text>

    <!-- 2 Sub Cards -->
    <rect x="105" y="125" width="132" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="130" cy="150" r="14" fill="#3b82f6" fill-opacity="0.2"/>
    <path d="M 124 150 L 128 154 L 136 146" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="120" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Fast &amp; Modern</text>
    <text x="120" y="198" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Optimized clean code</text>
    <rect x="120" y="215" width="100" height="5" rx="2" fill="#334155"/>
    <rect x="120" y="215" width="85" height="5" rx="2" fill="url(#accentGrad)"/>
    <text x="120" y="240" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">99.8% Perf</text>

    <rect x="253" y="125" width="132" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="278" cy="150" r="14" fill="#10b981" fill-opacity="0.2"/>
    <rect x="272" y="144" width="12" height="12" rx="2" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="268" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Responsive UI</text>
    <text x="268" y="198" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Mobile &amp; Desktop</text>
    <rect x="268" y="215" width="100" height="5" rx="2" fill="#334155"/>
    <rect x="268" y="215" width="95" height="5" rx="2" fill="#10b981"/>
    <text x="268" y="240" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">100% Fluid</text>
  </g>

  <!-- Floating Tech Badges -->
  <!-- Python Badge -->
  <g transform="translate(30, 90)" filter="url(#cardShadow)">
    <rect width="115" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="10" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="16" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">&lt;/&gt;</text>
    <text x="38" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Python &amp; API</text>
  </g>

  <!-- JavaScript Badge -->
  <g transform="translate(440, 95)" filter="url(#cardShadow)">
    <rect width="125" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="10" width="18" height="18" rx="4" fill="#f59e0b"/>
    <text x="15" y="23" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#0f172a">JS</text>
    <text x="38" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Modern JS</text>
  </g>

  <!-- Database & SQL Badge -->
  <g transform="translate(430, 390)" filter="url(#cardShadow)">
    <rect width="135" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="9" fill="#10b981" fill-opacity="0.2"/>
    <text x="16" y="23" font-family="'Inter', sans-serif" font-size="11" fill="#10b981">⚡</text>
    <text x="36" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">SQL &amp; DBMS</text>
  </g>
</svg>
