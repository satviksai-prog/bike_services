<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="srBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091420"/>
      <stop offset="100%" stop-color="#112233"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="srShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#srBg)"/>
  
  <!-- Subtle map grid pattern -->
  <circle cx="120" cy="190" r="160" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3 6" opacity="0.4"/>
  <circle cx="480" cy="190" r="140" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3 6" opacity="0.3"/>

  <!-- Main Container -->
  <g transform="translate(30, 25)" filter="url(#srShadow)">
    <rect width="540" height="330" rx="12" fill="#0b1320" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Top Bar -->
    <rect width="540" height="42" rx="12" fill="#152238"/>
    <circle cx="20" cy="21" r="5" fill="#ef4444"/>
    <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="21" r="5" fill="#10b981"/>
    
    <text x="80" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#10b981">🛡️ SafeRide</text>
    <text x="170" y="26" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">| Travel &amp; Vehicle Safety Organizer</text>

    <rect x="420" y="10" width="105" height="22" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="430" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#34d399">● Trip Active</text>

    <!-- Content Split: 2 Main Columns -->
    
    <!-- Left Column: Active Trip Card & Emergency SOS -->
    <g transform="translate(20, 60)">
      <rect width="250" height="245" rx="10" fill="#101b2d" stroke="#1e2d45" stroke-width="1"/>
      
      <!-- Trip Header -->
      <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">ACTIVE JOURNEY</text>
      <text x="18" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Mumbai → Goa Highway</text>
      <text x="18" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Estimated Arrival: 6h 30m • 420 km</text>

      <!-- Safety Route Progress -->
      <g transform="translate(18, 85)">
        <rect width="214" height="6" rx="3" fill="#1e293b"/>
        <rect width="130" height="6" rx="3" fill="url(#emeraldGrad)"/>
        <circle cx="130" cy="3" r="6" fill="#10b981" stroke="#f8fafc" stroke-width="2"/>
        <text x="0" y="24" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Passed: Kolhapur</text>
        <text x="145" y="24" font-family="'Inter', sans-serif" font-size="10" fill="#10b981">62% Done</text>
      </g>

      <!-- Quick Emergency Alert Trigger -->
      <g transform="translate(18, 135)">
        <rect width="214" height="90" rx="8" fill="#1c1924" stroke="#e11d48" stroke-width="1.2"/>
        <circle cx="32" cy="32" r="16" fill="#e11d48" fill-opacity="0.2"/>
        <text x="26" y="38" font-family="'Inter', sans-serif" font-size="15">🚨</text>
        <text x="56" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f43f5e">Instant SOS Share</text>
        <text x="56" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#fda4af">Sends live GPS to 3 emergency contacts</text>
        <rect x="18" y="58" width="178" height="22" rx="4" fill="url(#roseGrad)"/>
        <text x="58" y="73" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">One-Click Beacon</text>
      </g>
    </g>

    <!-- Right Column: Vehicle Vault & Checklist -->
    <g transform="translate(285, 60)">
      <rect width="235" height="245" rx="10" fill="#101b2d" stroke="#1e2d45" stroke-width="1"/>
      
      <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">SAFETY &amp; DOC VAULT</text>
      
      <!-- Vault Item 1 -->
      <g transform="translate(18, 42)">
        <rect width="200" height="38" rx="6" fill="#152438"/>
        <circle cx="20" cy="19" r="10" fill="#10b981" fill-opacity="0.2"/>
        <text x="15" y="23" font-family="'Inter', sans-serif" font-size="10" fill="#10b981">✓</text>
        <text x="38" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Driver's License &amp; RC</text>
        <text x="38" y="30" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Verified Offline Copy</text>
      </g>

      <!-- Vault Item 2 -->
      <g transform="translate(18, 88)">
        <rect width="200" height="38" rx="6" fill="#152438"/>
        <circle cx="20" cy="19" r="10" fill="#10b981" fill-opacity="0.2"/>
        <text x="15" y="23" font-family="'Inter', sans-serif" font-size="10" fill="#10b981">✓</text>
        <text x="38" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Emergency Contacts</text>
        <text x="38" y="30" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">3 Guardians Synced</text>
      </g>

      <!-- Vault Item 3 -->
      <g transform="translate(18, 134)">
        <rect width="200" height="38" rx="6" fill="#152438"/>
        <circle cx="20" cy="19" r="10" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="14" y="23" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8">ℹ</text>
        <text x="38" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Highway Helpline List</text>
        <text x="38" y="30" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Ambulance, Tow, Police</text>
      </g>

      <!-- Pre-Trip Inspection Badge -->
      <g transform="translate(18, 182)">
        <rect width="200" height="48" rx="6" fill="#0e2a22" stroke="#10b981" stroke-width="1"/>
        <text x="12" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#34d399">Pre-Trip Checklist: 100%</text>
        <text x="12" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#a7f3d0">Tire pressure, lights &amp; fuel passed</text>
      </g>
    </g>
  </g>
</svg>
