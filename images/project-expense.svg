<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="etBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1b2333"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="etShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#etBg)"/>
  
  <g transform="translate(30, 25)" filter="url(#etShadow)">
    <rect width="540" height="330" rx="12" fill="#0c121e" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Header -->
    <rect width="540" height="42" rx="12" fill="#1e293b"/>
    <circle cx="20" cy="21" r="5" fill="#ef4444"/>
    <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="21" r="5" fill="#10b981"/>
    
    <text x="80" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#a855f7">📊 Expense Tracker</text>
    <text x="215" y="26" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">| Daily Spending &amp; Budget Insights</text>

    <rect x="425" y="10" width="100" height="22" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="440" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#c084fc">Aug 2026</text>

    <!-- Content 2 Columns -->
    
    <!-- Left Column: Spending Breakdown & Donut representation -->
    <g transform="translate(20, 60)">
      <rect width="250" height="245" rx="10" fill="#131c2d" stroke="#1e2d45" stroke-width="1"/>
      <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">MONTHLY SPENDING</text>
      <text x="18" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">$1,240.50</text>
      <text x="18" y="74" font-family="'Inter', sans-serif" font-size="10" fill="#10b981">↓ 12% less than last month</text>

      <!-- Donut Chart & Category Labels -->
      <g transform="translate(45, 140)">
        <!-- Donut Circle Segments -->
        <circle cx="35" cy="35" r="32" fill="none" stroke="#334155" stroke-width="12"/>
        <circle cx="35" cy="35" r="32" fill="none" stroke="#3b82f6" stroke-width="12" stroke-dasharray="80 200" stroke-dashoffset="0"/>
        <circle cx="35" cy="35" r="32" fill="none" stroke="#10b981" stroke-width="12" stroke-dasharray="50 200" stroke-dashoffset="-80"/>
        <circle cx="35" cy="35" r="32" fill="none" stroke="#f59e0b" stroke-width="12" stroke-dasharray="40 200" stroke-dashoffset="-130"/>
        <circle cx="35" cy="35" r="32" fill="none" stroke="#a855f7" stroke-width="12" stroke-dasharray="30 200" stroke-dashoffset="-170"/>

        <!-- Legend list -->
        <g transform="translate(85, 0)">
          <circle cx="5" cy="8" r="4" fill="#3b82f6"/>
          <text x="16" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#f8fafc">Food &amp; Dining (40%)</text>
          
          <circle cx="5" cy="26" r="4" fill="#10b981"/>
          <text x="16" y="30" font-family="'Inter', sans-serif" font-size="10" fill="#f8fafc">Rent &amp; Bills (25%)</text>
          
          <circle cx="5" cy="44" r="4" fill="#f59e0b"/>
          <text x="16" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#f8fafc">Transport (20%)</text>

          <circle cx="5" cy="62" r="4" fill="#a855f7"/>
          <text x="16" y="66" font-family="'Inter', sans-serif" font-size="10" fill="#f8fafc">Misc &amp; Fun (15%)</text>
        </g>
      </g>
    </g>

    <!-- Right Column: Recent Transactions & Add Expense Button -->
    <g transform="translate(285, 60)">
      <rect width="235" height="245" rx="10" fill="#131c2d" stroke="#1e2d45" stroke-width="1"/>
      <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">RECENT TRANSACTIONS</text>

      <!-- Tx 1 -->
      <g transform="translate(16, 42)">
        <rect width="203" height="38" rx="6" fill="#172236"/>
        <circle cx="20" cy="19" r="10" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="14" y="23" font-family="'Inter', sans-serif" font-size="11">🍔</text>
        <text x="38" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Grocery &amp; Market</text>
        <text x="38" y="30" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Food &amp; Dining</text>
        <text x="160" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#f87171">-$42.00</text>
      </g>

      <!-- Tx 2 -->
      <g transform="translate(16, 88)">
        <rect width="203" height="38" rx="6" fill="#172236"/>
        <circle cx="20" cy="19" r="10" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="14" y="23" font-family="'Inter', sans-serif" font-size="11">⛽</text>
        <text x="38" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Fuel Refill</text>
        <text x="38" y="30" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Transport</text>
        <text x="160" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#f87171">-$28.50</text>
      </g>

      <!-- Tx 3 -->
      <g transform="translate(16, 134)">
        <rect width="203" height="38" rx="6" fill="#172236"/>
        <circle cx="20" cy="19" r="10" fill="#10b981" fill-opacity="0.2"/>
        <text x="14" y="23" font-family="'Inter', sans-serif" font-size="11">💼</text>
        <text x="38" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Freelance Payout</text>
        <text x="38" y="30" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Income Credit</text>
        <text x="155" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399">+$350.00</text>
      </g>

      <!-- Quick Add Action -->
      <g transform="translate(16, 185)">
        <rect width="203" height="36" rx="6" fill="#6366f1"/>
        <text x="65" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">+ Add Expense</text>
      </g>
    </g>
  </g>
</svg>
