<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bikeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="bcShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" rx="16" fill="url(#bcGrad)"/>
  
  <!-- Subtle Grid lines -->
  <line x1="40" y1="0" x2="40" y2="380" stroke="#334155" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="380" stroke="#334155" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="380" y1="0" x2="380" y2="380" stroke="#334155" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- App Container Window -->
  <g transform="translate(30, 25)" filter="url(#bcShadow)">
    <rect width="540" height="330" rx="12" fill="#090d16" stroke="#334155" stroke-width="1"/>
    
    <!-- Top Nav Header -->
    <rect width="540" height="42" rx="12" fill="#1e293b"/>
    <circle cx="20" cy="21" r="5" fill="#ef4444"/>
    <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="21" r="5" fill="#10b981"/>
    
    <!-- Brand Title in App -->
    <text x="80" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#38bdf8">🏍️ BikeCare</text>
    <text x="175" y="26" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">| Smart Maintenance &amp; Reminders</text>
    
    <rect x="430" y="10" width="95" height="22" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="442" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">⚡ Live Tracker</text>
    
    <!-- Left Column: Vehicle & Status Overview -->
    <g transform="translate(20, 60)">
      <!-- Main Status Card -->
      <rect width="230" height="155" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1.5"/>
      <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">VEHICLE PROFILE</text>
      <text x="18" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Yamaha FZ-S V3</text>
      <text x="18" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Reg: MH-12-AB-4509</text>
      
      <!-- Odometer Counter -->
      <rect x="18" y="85" width="194" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="30" y="105" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Current Odometer</text>
      <text x="30" y="127" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#38bdf8">14,850 km</text>
      <circle cx="185" cy="111" r="12" fill="#10b981" fill-opacity="0.2"/>
      <text x="180" y="115" font-family="'Inter', sans-serif" font-size="12" fill="#10b981">✓</text>
    </g>

    <!-- Right Column: Reminder Cards Grid -->
    <g transform="translate(265, 60)">
      <!-- Next Service Card -->
      <rect width="255" height="72" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="30" cy="36" r="18" fill="#3b82f6" fill-opacity="0.15"/>
      <text x="23" y="42" font-family="'Inter', sans-serif" font-size="16">🔧</text>
      <text x="60" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Next Scheduled Service</text>
      <text x="60" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Due in 15 days or at 15,500 km</text>
      <rect x="185" y="16" width="60" height="18" rx="4" fill="#0284c7"/>
      <text x="195" y="29" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">ON TIME</text>

      <!-- Insurance & PUC Card -->
      <g transform="translate(0, 83)">
        <rect width="255" height="72" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1.5"/>
        <circle cx="30" cy="36" r="18" fill="#f59e0b" fill-opacity="0.15"/>
        <text x="23" y="42" font-family="'Inter', sans-serif" font-size="16">📄</text>
        <text x="60" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">PUC &amp; Insurance Expiry</text>
        <text x="60" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#f59e0b">Renew in 28 days (Sep 2026)</text>
        <rect x="185" y="16" width="60" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="194" y="29" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#f59e0b">RENEW</text>
      </g>
    </g>

    <!-- Bottom Quick Stats Row -->
    <g transform="translate(20, 230)">
      <rect width="500" height="80" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1.5"/>
      
      <!-- Metric 1: Oil Change -->
      <g transform="translate(20, 15)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Last Engine Oil</text>
        <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">12,200 km</text>
        <text x="0" y="54" font-family="'Inter', sans-serif" font-size="10" fill="#10b981">Good (2,650 km ago)</text>
      </g>
      
      <line x1="170" y1="15" x2="170" y2="65" stroke="#334155" stroke-width="1"/>

      <!-- Metric 2: Total Expenses -->
      <g transform="translate(190, 15)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Annual Maintenance</text>
        <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">$148.50</text>
        <text x="0" y="54" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8">3 records logged</text>
      </g>

      <line x1="340" y1="15" x2="340" y2="65" stroke="#334155" stroke-width="1"/>

      <!-- Metric 3: Health Score -->
      <g transform="translate(360, 15)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Vehicle Health Score</text>
        <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#10b981">94% Optimal</text>
        <text x="0" y="54" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">All checks green</text>
      </g>
    </g>
  </g>
</svg>
